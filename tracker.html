<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cults Workstreams</title>
<style>
:root{--bg:#f7f6f9;--fg:#1d1b22;--muted:#6c6876;--line:#e3e0e8;--yes:#b5520f;--yesbg:#fdf0e6;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#16141b;--fg:#ece9f1;--muted:#a19cab;--line:#332f3d;--yes:#f0a066;--yesbg:#3a2516;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;padding:24px 16px}
.wrap{max-width:760px;margin:0 auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border-bottom:2px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.yes td{background:var(--yesbg)} td.b.yes{color:var(--yes);font-weight:700}
p{color:var(--muted);font-size:13px}
</style></head><body><div class="wrap">
<table><thead><tr><th>Workstream</th><th>Blocked on Cor</th><th>ETA till done</th></tr></thead><tbody id="rows"><tr><td colspan="3">Loading…</td></tr></tbody></table>
<p id="stamp"></p></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){
  try{
    const r=await fetch('status.json?t='+Date.now(),{cache:'no-store'}); const d=await r.json();
    const rows=[...d.rows].sort((a,b)=>(a.blocked==='Yes'?0:1)-(b.blocked==='Yes'?0:1));
    document.getElementById('rows').innerHTML=rows.map(x=>`<tr class="${x.blocked==='Yes'?'yes':''}"><td>${esc(x.workstream)}</td><td class="b ${x.blocked==='Yes'?'yes':''}">${esc(x.blocked)}</td><td>${esc(x.eta)}</td></tr>`).join('');
    document.getElementById('stamp').textContent='Updated '+(d.updated||'?')+' · checks for changes every 30 seconds';
  }catch(e){document.getElementById('stamp').textContent='Could not load status ('+e.message+'); retrying in 30 s';}
}
load(); setInterval(load,30000);
</script></body></html>
