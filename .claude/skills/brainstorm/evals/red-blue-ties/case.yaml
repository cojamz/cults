name: red-blue-ties
expected_outcome: |
  Two to four Red x Blue ties, each built on a moment both colors cause or on one color's verb moving the other's contest, written with card text that names neither color, checked in games without each color, and none of them a generic shop rule, a crossed tie, a member discount, a pile draw, or a resend of the refused Red x Blue lists.
