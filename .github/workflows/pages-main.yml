# Deploys main to GitHub Pages one push at a time (Nov 4, 2026).
# Why: with Pages set to "Deploy from a branch", every push to main starts GitHub's own "pages build and deployment",
# and a push that lands while another deploy is running fails with "due to in progress deployment" and emails Cory.
# Ships, harness mirrors and status pushes land minutes apart, so that happened several times a day.
# Here the concurrency group lets one deploy run while only the newest push waits; skipped pushes end "cancelled",
# which sends no email, and the newest commit always goes live.
# It only deploys while Settings > Pages > Source is "GitHub Actions" (Cory switched it Nov 4); otherwise it checks and ends green.
# Nov 6: two deploys (main a265c8f, 2d75283) failed with GitHub stuck at "syncing_files" for 10 minutes, not a collision.
# So the upload now leaves out what the site never serves (source, archive, scripts, harness), and a deploy that times out
# is tried once more with a longer wait before the run fails and emails Cory.
# Nov 6 later: 79ebe84 and c13cb07 failed the same way at 351 MB: GitHub held them 5+ minutes in deployment_queued and
# updating_pages, then the 10-minute cap hit. The retry was dropped (it can't work) and play/v keeps 1 old release, not 3.
# Lives on main (workflows run from the branch pushed); scripts/harness-sync-main.sh mirrors it from the game branch.
name: pages deploy (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: false

jobs:
  mode:
    runs-on: ubuntu-latest
    outputs:
      on: ${{ steps.mode.outputs.on }}
    steps:
      - name: Is Pages set to deploy from Actions?
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "Pages build type: $type"
          echo "on=$([ "$type" = workflow ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: mode
    if: needs.mode.outputs.on == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage only the files the site serves
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude .git --exclude .github --exclude .claude --exclude src --exclude archive \
            --exclude scripts --exclude node_modules --exclude 'package*.json' ./ "$RUNNER_TEMP/site/"
          du -sh "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      # One try only: deploy-pages caps its wait at 10 minutes and cancels the deployment when it runs out, and a second
      # try for the same commit gets "Deployment cancelled" at once (same deployment id), so the old retry never worked.
      - id: deployment
        uses: actions/deploy-pages@v4
